    - title: Founder
      institution: '<a href="https://facthink.com/">Facthink LTD</a>'
      year: 2026–now
      description:
        - Since May 2026, building Graph-Hypoth, a multi-agent hypothesis generation system that develops research claims into candidate hypotheses and literature-grounded experiment plans.
        - Seven specialised agents work over a shared claim graph to review evidence, propose and critique hypotheses, and design experiments, with fixed aggregation rules and versioned records for audit.
    - title: PhD Researcher
      institution: Imperial College London, Department of Electrical and Electronic Engineering
      year: 2022–2026
      description:
        - Used representation dimension to estimate language model performance after structural pruning.
        - Developed a unified taxonomy of matrix and tensor factorisation for generative language model compression.
        - Compressed GPT-series models with tensor decomposition and deployed them on resource-constrained devices, including Raspberry Pi.
        - 'Applied membership inference to dataset legitimacy assessment in MLaaS; this work was <a href="https://montrealethics.ai/private-training-set-inspection-in-mlaas/">featured by the Montreal AI Ethics Institute</a>.'
